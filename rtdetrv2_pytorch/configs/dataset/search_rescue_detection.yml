task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 6
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/vipuser/search-and-rescue-2/train/images
    ann_file: /home/vipuser/search-and-rescue-2/annotations/instances_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~

  shuffle: True
  num_workers: 4
  drop_last: True

  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/vipuser/search-and-rescue-2/valid/images
    ann_file: /home/vipuser/search-and-rescue-2/annotations/instances_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~

  shuffle: False
  num_workers: 4
  drop_last: False

  collate_fn:
    type: BatchImageCollateFunction